<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Market — IDZX</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #080d1b; --card: rgba(20,29,49,0.88); --border: rgba(148,163,184,0.18);
  --accent: #67e8f9; --text: #f8fafc; --muted: #9aa9bf;
  --accent2: #818cf8; --surface: rgba(255,255,255,0.045);
}
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  background-image: radial-gradient(ellipse at 12% 0%, rgba(34,211,238,0.13), transparent 42%),
                    radial-gradient(ellipse at 90% 80%, rgba(99,102,241,0.12), transparent 46%);
  padding-bottom: 70px;
}
.auth-screen { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
.auth-box {
  background: linear-gradient(145deg, rgba(24,36,60,.96), rgba(13,20,37,.96));
  border: 1px solid var(--border); border-radius: 22px;
  padding: 32px 28px; width: 100%; max-width: 420px; backdrop-filter: blur(16px);
  box-shadow: 0 24px 80px rgba(0,0,0,.38);
}
.auth-box h1 { text-align: center; margin-bottom: 24px; font-size: 1.6rem; }
.auth-box h1 span { color: var(--accent); }
.auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
.auth-tabs button {
  flex: 1; padding: 10px; border: none; background: rgba(255,255,255,0.06);
  color: var(--text); border-radius: 10px; cursor: pointer; font-weight: 500;
}
.auth-tabs button.active { background: rgba(34,211,238,0.2); color: var(--accent); }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: var(--muted); }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.06);
  border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem;
}
.btn {
  width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
  font-weight: 600; background: var(--accent); color: #0f172a; margin-top: 8px;
}
.btn:hover { filter: brightness(1.08); }
.error { color: #f87171; font-size: 0.85rem; margin-top: 8px; text-align: center; min-height: 1.2em; }
.app { display: none; }
.app.visible { display: block; }
.header {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 12px 16px; background: rgba(15,23,42,0.7); backdrop-filter: blur(12px);
  border: 1px solid var(--border); border-radius: 16px; margin: 12px 16px;
}
.logo { font-size: 1.35rem; font-weight: 700; }
.logo span { color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 12px; }
.balance { font-weight: 600; color: var(--accent); }
.avatar, .notif-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #22d3ee, #6366f1);
  display: grid; place-items: center; font-weight: 700; cursor: pointer; border: none; color: #fff; position: relative;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.notif-badge {
  position: absolute; top: -2px; right: -2px; background: #ef4444; color: #fff;
  font-size: 0.65rem; font-weight: 700; border-radius: 50%; min-width: 16px; height: 16px;
  display: none; align-items: center; justify-content: center;
}
.search { position: relative; margin: 0 16px 12px; }
.search input {
  width: 100%; padding: 12px 16px 12px 42px;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  border-radius: 12px; color: var(--text); font-size: 1rem;
}
.search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
.grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 12px 20px;
}
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-2px); }
.card-canvas { width: 100%; height: 90px; display: block; }
.card-info { padding: 8px 10px; font-size: 0.8rem; }
.card-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-price { color: var(--accent); font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 40px 16px; grid-column: 1 / -1; }
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
  background: rgba(15,23,42,0.95); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: flex; z-index: 100;
}
.nav-btn {
  flex: 1; border: none; background: transparent; color: var(--muted);
  font-size: 0.75rem; font-weight: 500; cursor: pointer;
}
.nav-btn.active { color: var(--accent); }
.admin-btn {
  position: fixed; bottom: 72px; right: 16px; z-index: 90;
  padding: 12px 16px; width: auto; border-radius: 12px;
}
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
}
.modal.show { display: flex; }
.modal-content {
  background: #1e293b; border: 1px solid var(--border); border-radius: 20px;
  padding: 20px; max-width: 420px; width: 100%; max-height: 90vh; overflow-y: auto;
}
.viewer-canvas { width: 100%; height: 220px; border-radius: 12px; margin-bottom: 12px; }
@media (max-width: 600px) {
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .card-canvas { height: 80px; }
  .header { margin: 8px; padding: 10px; }
  .search { margin: 0 8px 12px; }
}
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.auth-tabs button, .nav-btn, .header button, .btn {
  transition: transform .16s ease, filter .16s ease, background .16s ease, border-color .16s ease;
}
.btn { box-shadow: 0 8px 24px rgba(34,211,238,.12); }
.btn:active, .nav-btn:active { transform: scale(.98); }
.form-group input, .form-group select, .form-group textarea {
  background: rgba(7,13,27,.72); border-color: rgba(148,163,184,.22);
}
.modal-content { background: linear-gradient(155deg, #17233b, #0d1528); border:1px solid var(--border); }

</style>
</head>
<body>

<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h1>3D <span>Market</span></h1>
    <p style="color:var(--muted);font-size:.82rem;text-align:center;line-height:1.5;margin:-12px 0 20px">
      Локальная версия: данные хранятся только в этом браузере и на этом устройстве.
    </p>
    <div class="auth-tabs">
      <button id="loginTab" class="active">Вход</button>
      <button id="regTab">Регистрация</button>
    </div>
    <div id="loginForm">
      <div class="form-group"><label>Username</label><input type="text" id="loginUser" autocomplete="username"></div>
      <div class="form-group"><label>Пароль</label><input type="password" id="loginPass" autocomplete="current-password"></div>
      <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
        <input type="checkbox" id="rememberMe" style="width:auto">
        <label for="rememberMe" style="margin:0;cursor:pointer">Запомнить устройство</label>
      </div>
      <button class="btn" id="doLogin">Войти</button>
      <div class="error" id="loginError"></div>
    </div>
    <div id="regForm" style="display:none">
      <div class="form-group"><label>Имя</label><input type="text" id="regName"></div>
      <div class="form-group"><label>Фамилия</label><input type="text" id="regSurname"></div>
      <div class="form-group"><label>Username</label><input type="text" id="regUser"></div>
      <div class="form-group"><label>Пароль</label><input type="password" id="regPass"></div>
      <button class="btn" id="doReg">Зарегистрироваться</button>
      <div class="error" id="regError"></div>
    </div>
    <button class="btn" id="resetData" style="background:#64748b;margin-top:16px;font-size:0.85rem">Сбросить все данные</button>
  </div>
</div>

<div class="app" id="app">
  <header class="header">
    <div class="logo">3D <span>Market</span><small style="display:block;color:var(--muted);font-size:.62rem;letter-spacing:.12em;font-weight:600">IDZX MARKETPLACE</small></div>
    <div class="header-right">
      <button class="notif-btn" id="notifBtn">🔔<span class="notif-badge" id="notifBadge">0</span></button>
      <div class="balance" id="balance">1000 ₽</div>
      <div class="avatar" id="avatarBtn">И</div>
    </div>
  </header>
  <div class="search">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Поиск...">
  </div>
  <div class="grid" id="grid"></div>
</div>

<button class="btn admin-btn" id="uploadBtn" style="display:none">+ 3D</button>

<nav class="bottom-nav">
  <button class="nav-btn active" data-tab="shop">◈ Магазин</button>
  <button class="nav-btn" data-tab="inventory">▣ Инвентарь</button>
  <button class="nav-btn" data-tab="market">◇ Маркет</button>
  <button class="nav-btn" data-tab="following">◎ Подписки</button>
</nav>

<!-- Profile -->
<div class="modal" id="profileModal">
  <div class="modal-content">
    <h2>Профиль</h2>
    <div class="form-group"><label>Аватар</label><input type="file" id="avatarFile" accept="image/*"></div>
    <div class="form-group"><label>Имя</label><input type="text" id="nameInput"></div>
    <div class="form-group"><label>Фамилия</label><input type="text" id="surnameInput"></div>
    <div class="form-group"><label>Username</label><input type="text" id="usernameInput" readonly>
      <small id="usernameHint" style="display:block;color:var(--muted);margin-top:5px">Username нельзя изменить.</small>
    </div>
    <div class="form-group"><label>Описание</label><textarea id="descInput" rows="3"></textarea></div>
    <div class="form-group"><label>Валюта</label>
      <select id="currencySelect"><option value="RUB">₽ Рубли</option><option value="USD">$ Доллары</option><option value="EUR">€ Евро</option></select>
    </div>
    <div class="form-group"><label>Язык</label>
      <select id="langSelect"><option value="ru">Русский</option><option value="en">English</option></select>
    </div>
    <div class="form-group"><label>Флаг</label>
      <select id="flagSelect">
        <option value="">—</option>
        <option value="🇷🇺">🇷🇺 Россия</option><option value="🇺🇸">🇺🇸 США</option><option value="🇪🇺">🇪🇺 Европа</option>
        <option value="🇬🇧">🇬🇧 UK</option><option value="🇩🇪">🇩🇪 Германия</option><option value="🇫🇷">🇫🇷 Франция</option>
        <option value="🇯🇵">🇯🇵 Япония</option><option value="🇨🇳">🇨🇳 Китай</option><option value="🇰🇷">🇰🇷 Корея</option>
        <option value="🇨🇦">🇨🇦 Канада</option><option value="🇦🇺">🇦🇺 Австралия</option><option value="🇧🇷">🇧🇷 Бразилия</option>
        <option value="🇮🇳">🇮🇳 Индия</option><option value="🇹🇷">🇹🇷 Турция</option><option value="🇺🇦">🇺🇦 Украина</option>
        <option value="🇰🇿">🇰🇿 Казахстан</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin:10px 0">
      <input type="checkbox" id="showBalanceCheck" style="width:auto">
      <label for="showBalanceCheck" style="margin:0">Показывать баланс в профиле</label>
    </div>
    <div style="border-top:1px solid var(--border);margin:18px 0 14px;padding-top:16px">
      <h3 style="font-size:1rem;margin-bottom:12px">Безопасность</h3>
      <div class="form-group"><label>Текущий пароль</label><input type="password" id="currentPass" autocomplete="current-password"></div>
      <div class="form-group"><label>Новый пароль</label><input type="password" id="newPass" autocomplete="new-password"></div>
      <div class="form-group"><label>Повтор нового пароля</label><input type="password" id="confirmPass" autocomplete="new-password"></div>
      <button class="btn" id="changePassBtn" type="button">Изменить пароль</button>
      <div class="error" id="securityError"></div>
    </div>
    <button class="btn" id="saveProfile">Сохранить</button>
    <button class="btn" id="logoutBtn" style="background:#ef4444;color:#fff">Выйти</button>
  </div>
</div>

<!-- Upload -->
<div class="modal" id="uploadModal">
  <div class="modal-content">
    <h2>Загрузить модель</h2>
    <div class="form-group"><label>Файл (.glb, до 50 МБ)</label><input type="file" id="modelFile" accept=".glb,model/gltf-binary"></div>
    <div class="form-group"><label>Название</label><input type="text" id="modelName"></div>
    <div class="form-group"><label>Цена</label><input type="number" id="modelPrice" min="0" value="100"></div>
    <div class="form-group"><label>Количество</label><input type="number" id="modelQty" min="1" value="10"></div>
    <div class="form-group"><label>Редкость</label>
      <select id="modelRarity">
        <option value="white">Белый — обычный</option>
        <option value="green">Зелёный</option>
        <option value="yellow">Жёлтый</option>
        <option value="red">Красный</option>
        <option value="purple">Фиолетовый — легендарный</option>
      </select>
    </div>
    <button class="btn" id="doUpload">Загрузить</button>
  </div>
</div>

<!-- Viewer -->
<div class="modal" id="viewerModal">
  <div class="modal-content">
    <h2 id="viewerTitle">Модель</h2>
    <canvas class="viewer-canvas" id="viewerCanvas"></canvas>
    <div id="viewerInfo"></div>
    <div id="viewerActions"></div>
  </div>
</div>

<!-- Notifications -->
<div class="modal" id="notifModal">
  <div class="modal-content">
    <h2>Уведомления</h2>
    <div id="notifList"></div>
    <button class="btn" id="clearNotif" style="margin-top:12px">Очистить</button>
  </div>
</div>

<script>
const I18N = {
  ru: { shop:'Магазин', inventory:'Инвентарь', market:'Маркет', following:'Подписки', empty:'Пока пусто', buy:'Купить', sell:'Продать', notEnough:'Недостаточно средств', setPrice:'Цена продажи' },
  en: { shop:'Shop', inventory:'Inventory', market:'Market', following:'Following', empty:'Empty', buy:'Buy', sell:'Sell', notEnough:'Not enough funds', setPrice:'Sell price' }
};
const RARITY_COLORS = { white:'#e5e7eb', green:'#22c55e', yellow:'#eab308', red:'#ef4444', purple:'#a855f7' };
const RARITY_NAMES = { white:'Обычный', green:'Необычный', yellow:'Редкий', red:'Эпический', purple:'Легендарный' };

function readStorage(key, fallback) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || 'null');
    return value ?? fallback;
  } catch (error) {
    console.warn('Повреждены локальные данные:', key, error);
    return fallback;
  }
}
let users = readStorage('idzx_users', []);
if (!Array.isArray(users)) users = [];
// Миграция старого локального администратора. Пароль намеренно не зашит в HTML.
let adminUser = users.find(u => u.isAdmin || ['IDZXTTU','IDzxttu','A10XDTU'].includes(u.username));
if (!adminUser) {
  adminUser = { name:'Админ', surname:'Админ', username:'IDzxttu', pass:'', isAdmin:true,
    balance:1000000, description:'Администратор 3D Market', inventory:{}, avatar:'',
    currency:'RUB', lang:'ru', flag:'', showBalance:false, followers:[], following:[] };
  users.push(adminUser);
} else {
  const previousAdminUsername = adminUser.username;
  adminUser.isAdmin = true;
  adminUser.name = 'Админ';
  adminUser.surname = 'Админ';
  if (adminUser.username === 'IDZXTTU' || adminUser.username === 'A10XDTU') adminUser.username = 'IDzxttu';
  if (adminUser.pass === 'админ 123') adminUser.pass = '';
  if (previousAdminUsername !== adminUser.username) {
    users.forEach(u => {
      if (Array.isArray(u.followers)) u.followers = u.followers.map(x => x === previousAdminUsername ? adminUser.username : x);
      if (Array.isArray(u.following)) u.following = u.following.map(x => x === previousAdminUsername ? adminUser.username : x);
    });
    const oldListings = readStorage('idzx_listings', []);
    if (Array.isArray(oldListings)) oldListings.forEach(l => { if (l.seller === previousAdminUsername) l.seller = adminUser.username; });
    localStorage.setItem('idzx_listings', JSON.stringify(oldListings));
  }
  if (!adminUser.username) adminUser.username = 'IDzxttu';
  if (typeof adminUser.pass !== 'string') adminUser.pass = '';
  adminUser.followers = Array.isArray(adminUser.followers) ? adminUser.followers : [];
  adminUser.following = Array.isArray(adminUser.following) ? adminUser.following : [];
}
localStorage.setItem('idzx_users', JSON.stringify(users));
let currentUser = null;
let models = [];
let listings = readStorage('idzx_listings', []);
if (!Array.isArray(listings)) listings = [];
let notifications = readStorage('idzx_notifs', []);
if (!Array.isArray(notifications)) notifications = [];
let rates = { RUB:90, USD:1, EUR:0.92 };
let currentTab = 'shop';
let THREE, GLTFLoader, OrbitControls;
let viewerRenderer = null;
let viewerControls = null;
let viewerAnimationId = 0;
const miniRenderers = new Set();

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[ch]);
}
function safeArray(value) { return Array.isArray(value) ? value : []; }
function persistCurrentUser() {
  const index = users.findIndex(u => u.username === currentUser?.username);
  if (index >= 0) users[index] = currentUser;
  saveUsers();
}
function closeViewer() {
  document.getElementById('viewerModal').classList.remove('show');
  if (viewerAnimationId) cancelAnimationFrame(viewerAnimationId);
  viewerAnimationId = 0;
  if (viewerControls) viewerControls.dispose();
  viewerControls = null;
  if (viewerRenderer) viewerRenderer.dispose();
  viewerRenderer = null;
}

function t(k) { return (I18N[currentUser?.lang || 'ru'] || I18N.ru)[k] || k; }
function saveUsers() { localStorage.setItem('idzx_users', JSON.stringify(users)); }
function saveListings() { localStorage.setItem('idzx_listings', JSON.stringify(listings)); }
function saveNotifs() { localStorage.setItem('idzx_notifs', JSON.stringify(notifications)); }
function changeUsernameReferences(oldName, newName) {
  users.forEach(u => {
    if (Array.isArray(u.followers)) u.followers = u.followers.map(x => x === oldName ? newName : x);
    if (Array.isArray(u.following)) u.following = u.following.map(x => x === oldName ? newName : x);
  });
  listings.forEach(l => { if (l.seller === oldName) l.seller = newName; });
  notifications = notifications.map(n => typeof n === 'string' ? n.replaceAll(oldName, newName) : n);
  saveListings(); saveNotifs();
}


function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('idzx3d', 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('models')) r.result.createObjectStore('models', { keyPath:'id' }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function loadModels() {
  const db = await openDB();
  return new Promise(res => {
    const tx = db.transaction('models','readonly');
    const req = tx.objectStore('models').getAll();
    req.onsuccess = () => {
      models = (req.result || []).map(m => {
        if (m.data && !(m.data instanceof ArrayBuffer)) {
          // на всякий случай
          m.data = m.data.buffer || m.data;
        }
        return m;
      });
      res(models);
    };
  });
}
async function saveModel(m) {
  const db = await openDB();
  return new Promise(res => {
    const tx = db.transaction('models','readwrite');
    tx.objectStore('models').put(m);
    tx.oncomplete = () => res();
  });
}

async function fetchRates() {
  try {
    const r = await fetch('https://api.frankfurter.app/latest?from=USD&to=RUB,EUR');
    const d = await r.json();
    if (d.rates) { rates.RUB = d.rates.RUB || rates.RUB; rates.EUR = d.rates.EUR || rates.EUR; }
  } catch(e) {}
  updateBalance();
}
setInterval(fetchRates, 6 * 60 * 60 * 1000);
fetchRates();

function convert(price) {
  const cur = currentUser?.currency || 'RUB';
  if (cur === 'RUB') return price;
  const usd = price / rates.RUB;
  return cur === 'USD' ? usd : usd * rates.EUR;
}
function formatPrice(p) {
  const v = convert(p);
  const cur = currentUser?.currency || 'RUB';
  const s = cur === 'USD' ? '$' : cur === 'EUR' ? '€' : '₽';
  return v.toFixed(cur === 'RUB' ? 0 : 2) + ' ' + s;
}
function updateBalance() {
  if (currentUser) document.getElementById('balance').textContent = formatPrice(currentUser.balance);
}
function updateNotifBadge() {
  const n = notifications.filter(x => !x.read).length;
  const b = document.getElementById('notifBadge');
  b.style.display = n ? 'flex' : 'none';
  b.textContent = n > 9 ? '9+' : n;
}
function addNotif(text) {
  notifications.unshift({ id:Date.now(), text, time:new Date().toLocaleString(), read:false });
  if (notifications.length > 50) notifications.length = 50;
  saveNotifs();
  updateNotifBadge();
}

function tryAutoLogin() {
  const rem = localStorage.getItem('idzx_remember');
  if (rem) {
    const u = users.find(x => x.username === rem);
    if (u) { currentUser = u; showApp(); }
  }
}
function showApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('app').classList.add('visible');
  updateApp();
}
function updateApp() {
  if (!currentUser) return;
  currentUser.inventory = currentUser.inventory || {};
  currentUser.followers = safeArray(currentUser.followers);

async function loadThree() {
  if (THREE) return;
  try {
    // esm.sh bundles/re-writes the "three" imports used by Three.js examples.
    const base = 'https://esm.sh/three@0.160.0';
    const [threeModule, gltfModule, controlsModule] = await Promise.all([
      import(base),
      import(base + '/examples/jsm/loaders/GLTFLoader.js'),
      import(base + '/examples/jsm/controls/OrbitControls.js')
    ]);
    THREE = threeModule;
    GLTFLoader = gltfModule.GLTFLoader;
    OrbitControls = controlsModule.OrbitControls;
  } catch (e) {
    console.error('Three.js load failed', e);
    throw new Error('Не удалось загрузить библиотеку 3D. Проверь интернет-соединение.');
  }
}
async function initMini(canvas, item, bg) {
  if (!item || !item.data) {
    canvas.style.background = bg;
    return;
  }
  // Принудительно задаём размер canvas
  canvas.width = canvas.clientWidth || 100;
  canvas.height = 90;
  canvas.style.background = bg;

  try {
    await loadThree();
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(45, canvas.width / canvas.height, 0.1, 100);
    cam.position.set(0, 0, 2.2);
    const ren = new THREE.WebGLRenderer({ canvas, antialias: true });
    ren.setSize(canvas.width, canvas.height);
    ren.setPixelRatio(1);
    ren.setClearColor(new THREE.Color(bg));
    ren.outputColorSpace = THREE.SRGBColorSpace;

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const light = new THREE.DirectionalLight(0xffffff, 1.2);
    light.position.set(1, 2, 2);
    scene.add(light);

    const loader = new GLTFLoader();
    loader.parse(item.data, '', (gltf) => {
      const model = gltf.scene;
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      model.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      model.scale.setScalar(1.1 / maxDim);
      scene.add(model);

      let frame = 0;
      function animate() {
        frame++;
        if (frame > 5000) return; // не крутить бесконечно если карточка удалена
        requestAnimationFrame(animate);
        model.rotation.y += 0.02;
        ren.render(scene, cam);
      }
      animate();
    }, (err) => {
      console.warn('Parse failed', err);
      showMiniError(canvas, 'Ошибка файла');
    });
  } catch (e) {
    console.warn(e);
    showMiniError(canvas, 'Нет 3D');
  }
}
function showMiniError(canvas, text) {
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  canvas.width = canvas.clientWidth || 100;
  canvas.height = 90;
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#f87171';
  ctx.font = '12px system-ui';
  ctx.textAlign = 'center';
  ctx.fillText(text, canvas.width / 2, 50);
}

function closeViewer() { document.getElementById('viewerModal').classList.remove('show'); }
async function loadViewer(item, color) {
  try {
    await loadThree();
    const canvas = document.getElementById('viewerCanvas');
    canvas.style.background = color;
    const scene = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(45, canvas.clientWidth / 220 || 1.5, 0.1, 100);
    cam.position.set(0, 0, 3);
    if (viewerRenderer) viewerRenderer.dispose();
    if (viewerControls) viewerControls.dispose();
    const ren = new THREE.WebGLRenderer({ canvas, antialias: true });
    viewerRenderer = ren;
    ren.setSize(canvas.clientWidth || 360, 220);
    ren.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    ren.setClearColor(new THREE.Color(color));
    ren.outputColorSpace = THREE.SRGBColorSpace;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
    keyLight.position.set(2, 3, 2);
    scene.add(keyLight);
    const ctrl = new OrbitControls(cam, canvas);
    viewerControls = ctrl;
    ctrl.enableDamping = true;
    if (item.data) {
      new GLTFLoader().parse(item.data, '', gltf => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        model.scale.setScalar(1.5 / maxDim);
        scene.add(model);
        function animate() {
          if (!document.getElementById('viewerModal').classList.contains('show')) return;
          viewerAnimationId = requestAnimationFrame(animate);
          ctrl.update();
          model.rotation.y += 0.01;
          ren.render(scene, cam);
        }
        animate();
      }, err => {
        console.warn('Viewer GLTF error', err);
        document.getElementById('viewerInfo').innerHTML += '<p style="color:#f87171;margin-top:8px">Не удалось загрузить 3D-модель</p>';
      });
    }
  } catch (e) {
    console.warn(e);
    document.getElementById('viewerInfo').innerHTML += '<p style="color:#f87171;margin-top:8px">3D-просмотр недоступен. Проверь интернет и формат файла.</p>';
  }
}

function buyShop(item) {
  if (currentUser.balance < item.price) return alert(t('notEnough'));
  if ((item.stock||0)<=0) return;
  currentUser.balance -= item.price;
  currentUser.inventory[item.id] = (currentUser.inventory[item.id]||0)+1;
  item.stock--;
  users[users.findIndex(u=>u.username===currentUser.username)] = currentUser;
  saveUsers(); saveModel(item);
  models[models.findIndex(m=>m.id===item.id)] = item;
  updateApp(); closeViewer();
}
function sellItem(item, price) {
  if (!price || price<=0) return alert(t('setPrice'));
  if ((currentUser.inventory[item.id]||0)<=0) return;
  currentUser.inventory[item.id]--;
  if (currentUser.inventory[item.id]<=0) delete currentUser.inventory[item.id];
  let ex = listings.find(l => l.modelId===item.id && l.seller===currentUser.username);
  if (ex) { ex.qty=(ex.qty||1)+1; ex.price=price; } else listings.push({ modelId:item.id, seller:currentUser.username, price, qty:1 });
  users[users.findIndex(u=>u.username===currentUser.username)] = currentUser;
  saveUsers(); saveListings();
  addNotif(`${currentUser.username} выставил ${escapeHTML(item.name)}`);
  updateApp(); closeViewer();
}
function buyListing(l) {
  if (currentUser.balance < l.price) return alert(t('notEnough'));
  currentUser.balance -= l.price;
  currentUser.inventory[l.modelId] = (currentUser.inventory[l.modelId]||0)+1;
  l.qty = (l.qty||1)-1;
  const seller = users.find(u=>u.username===l.seller);
  if (seller) seller.balance += l.price;
  if (l.qty<=0) listings = listings.filter(x=>x!==l);
  users[users.findIndex(u=>u.username===currentUser.username)] = currentUser;
  saveUsers(); saveListings();
  updateApp(); closeViewer();
}
function cancelListing(l) {
  currentUser.inventory[l.modelId] = (currentUser.inventory[l.modelId]||0) + (l.qty||1);
  listings = listings.filter(x=>x!==l);
  users[users.findIndex(u=>u.username===currentUser.username)] = currentUser;
  saveUsers(); saveListings();
  updateApp(); closeViewer();
}

function openUserProfile(user) {
  const followers = (user.followers||[]).length;
  const following = (user.following||[]).length;
  const isF = (currentUser.following||[]).includes(user.username);
  const bal = user.showBalance ? formatPrice(user.balance) : '••••••';
  document.getElementById('viewerTitle').textContent = (user.flag||'')+' '+(user.name||'')+' '+(user.surname||'');
  document.getElementById('viewerInfo').innerHTML = `
    <div style="text-align:center">
      <div style="width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:linear-gradient(135deg,#22d3ee,#6366f1);overflow:hidden;display:grid;place-items:center;font-size:1.4rem">
        ${user.avatar ? `<img src="${escapeHTML(user.avatar)}" style="width:100%;height:100%;object-fit:cover">` : (user.name||user.username)[0].toUpperCase()}
      </div>
      <div>@${escapeHTML(user.username)}</div>
      <div style="color:var(--muted);font-size:0.85rem;margin:6px 0">${escapeHTML(user.description||'')}</div>
      <div>${bal}</div>
      <div style="margin:8px 0"><strong>${followers}</strong> подписчиков · <strong>${following}</strong> подписок</div>
    </div>`;
  const acts = document.getElementById('viewerActions');
  acts.innerHTML = '';
  if (user.username !== currentUser.username) {
    const b = document.createElement('button'); b.className='btn'; b.textContent = isF ? 'Отписаться' : 'Подписаться';
    b.onclick = () => toggleFollow(user.username); acts.appendChild(b);
  }
  document.getElementById('viewerModal').classList.add('show');
}
function toggleFollow(un) {
  if (!currentUser.following) currentUser.following = [];
  const t = users.find(u=>u.username===un);
  if (!t) return;
  if (!t.followers) t.followers = [];
  const i = currentUser.following.indexOf(un);
  if (i>=0) { currentUser.following.splice(i,1); const fi=t.followers.indexOf(currentUser.username); if(fi>=0) t.followers.splice(fi,1); }
  else { currentUser.following.push(un); t.followers.push(currentUser.username); }
  users[users.findIndex(u=>u.username===currentUser.username)] = currentUser;
  saveUsers();
  openUserProfile(t);
}

  }
  if (file.size > 50 * 1024 * 1024) return alert('Файл слишком большой (макс. 50 МБ)');
  try {
    const data = await file.arrayBuffer();

    document.getElementById('modelFile').value = '';
    document.getElementById('modelName').value = '';

document.getElementById('notifBtn').onclick = () => {
  const list = document.getElementById('notifList');
  list.innerHTML = notifications.length ? notifications.map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">${escapeHTML(n.text)}<div style="font-size:0.75rem;color:var(--muted)">${escapeHTML(n.time)}</div></div>`).join('') : '<div style="color:var(--muted);text-align:center">Пусто</div>';
  notifications.forEach(n=>n.read=true); saveNotifs(); updateNotifBadge();
  document.getElementById('notifModal').classList.add('show');
};
document.getElementById('clearNotif').onclick = () => { notifications=[]; saveNotifs(); document.getElementById('notifList').innerHTML=''; updateNotifBadge(); };

document.querySelectorAll('.modal').forEach(m => m.onclick = e => {
  if (e.target === m) {
    if (m.id === 'viewerModal') closeViewer();
    else m.classList.remove('show');
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.modal.show').forEach(m => {
      if (m.id === 'viewerModal') closeViewer();
      else m.classList.remove('show');
    });
  }
});

(async () => {
  try {
    await loadModels();
    tryAutoLogin();
  } catch (error) {
    console.error(error);
    alert('Не удалось открыть локальную базу данных. Открой сайт в современном браузере и разреши IndexedDB.');
  }
})();
</script>
