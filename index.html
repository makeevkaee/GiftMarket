<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Market</title>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#080d1b;--panel:#131d32;--line:#29364d;--cyan:#67e8f9;--muted:#9aa9bf;--text:#f8fafc}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#123044 0,transparent 42%),var(--bg);color:var(--text);font:15px system-ui,Arial}
button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--cyan);color:#07111e;font-weight:700}
input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#0b1425;color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{margin:0;font-size:25px}h1 span{color:var(--cyan)}.muted{color:var(--muted)}.panel{background:#131d32eF;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.auth{max-width:420px;margin:8vh auto}.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;background:#26354d;color:white}.tabs button.active{background:var(--cyan);color:#07111e}
.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:var(--muted)}.hidden{display:none!important}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.product{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
model-viewer{width:100%;height:190px;background:#0a1221}
.product-info{padding:13px}.price{color:var(--cyan);font-weight:800}.small{font-size:13px;color:var(--muted)}
.error{color:#fca5a5;min-height:20px}.success{color:#86efac;min-height:20px}
#status{white-space:pre-wrap}.danger{background:#7f1d1d;color:white}
@media(max-width:600px){.wrap{padding:12px}.panel{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <section id="auth" class="auth panel">
    <h1>3D <span>Market</span></h1>
    <p class="muted">Общий каталог 3D-моделей. Аккаунты и товары хранятся в облаке.</p>
    <div class="tabs"><button id="loginTab" class="active">Вход</button><button id="registerTab">Регистрация</button></div>
    <div id="loginForm">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email"></div>
      <div class="field"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
      <button id="loginBtn">Войти</button>
    </div>
    <div id="registerForm" class="hidden">
      <div class="field"><label>Имя пользователя</label><input id="regUsername" maxlength="24"></div>
      <div class="field"><label>Email</label><input id="regEmail" type="email" autocomplete="email"></div>
      <div class="field"><label>Пароль (минимум 8 символов)</label><input id="regPassword" type="password" autocomplete="new-password"></div>
      <button id="registerBtn">Создать аккаунт</button>
    </div>
    <p id="authMessage" class="error"></p>
  </section>

  <main id="app" class="hidden">
    <header class="top">
      <h1>3D <span>Market</span></h1>
      <div class="toolbar"><span id="who" class="muted"></span><button id="logoutBtn" class="danger">Выйти</button></div>
    </header>
    <section class="panel">
      <div class="toolbar"><input id="search" placeholder="Поиск моделей..."><button id="refreshBtn">Обновить</button></div>
      <p class="small">Все опубликованные товары видны всем пользователям сайта, независимо от устройства.</p>
    </section>
    <section id="adminPanel" class="panel hidden">
      <h2>Добавить 3D-модель</h2>
      <div class="field"><label>Название</label><input id="productTitle" maxlength="100"></div>
      <div class="field"><label>Описание</label><textarea id="productDescription" rows="3" maxlength="1000"></textarea></div>
      <div class="field"><label>Цена</label><input id="productPrice" type="number" min="0" step="0.01" value="0"></div>
      <div class="field"><label>Файл модели (.glb, до 50 МБ)</label><input id="modelFile" type="file" accept=".glb,model/gltf-binary"></div>
      <button id="uploadBtn">Опубликовать товар</button>
      <p id="uploadMessage" class="error"></p>
    </section>
    <section><h2>Каталог</h2><div id="products" class="grid"></div><p id="catalogMessage" class="muted"></p></section>
  </main>
</div>
<script>
(() => {
  const SUPABASE_URL = "ВСТАВЬТЕ_SUPABASE_PROJECT_URL";
  const SUPABASE_ANON_KEY = "ВСТАВЬТЕ_SUPABASE_ANON_KEY";
  const BUCKET = "models";
  const $ = id => document.getElementById(id);
  const configured = !SUPABASE_URL.startsWith("ВСТАВЬТЕ_") && !SUPABASE_ANON_KEY.startsWith("ВСТАВЬТЕ_");
  let sb = null, currentUser = null, profile = null, allProducts = [];
  if (configured) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function message(id, text, kind="error"){ const el=$(id); el.textContent=text; el.className=kind; }
  function showAuth(){ $("auth").classList.remove("hidden"); $("app").classList.add("hidden"); }
  function showApp(){ $("auth").classList.add("hidden"); $("app").classList.remove("hidden"); }
  function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function switchTab(which){
    const login=which==="login";
    $("loginForm").classList.toggle("hidden",!login); $("registerForm").classList.toggle("hidden",login);
    $("loginTab").classList.toggle("active",login); $("registerTab").classList.toggle("active",!login);
    message("authMessage","");
  }
  async function loadProfile(){
    const {data,error}=await sb.from("profiles").select("id,username,role").eq("id",currentUser.id).single();
    if(error) throw error; profile=data;
    $("who").textContent="@"+profile.username;
    $("adminPanel").classList.toggle("hidden",profile.role!=="admin");
  }
  async function loadProducts(){
    $("catalogMessage").textContent="Загрузка...";
    const {data,error}=await sb.from("products").select("id,title,description,price,file_path,created_at,owner_id").order("created_at",{ascending:false});
    if(error){$("catalogMessage").textContent="Ошибка загрузки: "+error.message;return;}
    allProducts=data||[]; renderProducts();
  }
  function renderProducts(){
    const q=$("search").value.trim().toLowerCase();
    const list=allProducts.filter(p=>(p.title+" "+(p.description||"")).toLowerCase().includes(q));
    $("products").innerHTML=list.map(p=>{
      const url=sb.storage.from(BUCKET).getPublicUrl(p.file_path).data.publicUrl;
      return `<article class="product"><model-viewer src="${escapeHtml(url)}" camera-controls auto-rotate shadow-intensity="1" loading="lazy" alt="${escapeHtml(p.title)}"></model-viewer><div class="product-info"><b>${escapeHtml(p.title)}</b><p class="small">${escapeHtml(p.description||"")}</p><div class="price">${Number(p.price).toLocaleString("ru-RU")} ₽</div><p class="small">Автор: ${escapeHtml(p.owner_id===currentUser.id ? profile.username : "пользователь")}</p></div></article>`;
    }).join("");
    $("catalogMessage").textContent=list.length?"":"Пока товаров нет.";
  }
  async function enter(session){
    currentUser=session.user;
    try{await loadProfile();showApp();await loadProducts();}
    catch(e){message("authMessage","Не удалось загрузить профиль: "+e.message);await sb.auth.signOut();showAuth();}
  }
  $("loginTab").onclick=()=>switchTab("login"); $("registerTab").onclick=()=>switchTab("register");
  $("loginBtn").onclick=async()=>{
    if(!sb)return message("authMessage","Сначала вставьте URL и anon key Supabase в index.html.");
    const {data,error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});
    if(error)return message("authMessage",error.message); await enter(data.session);
  };
  $("registerBtn").onclick=async()=>{
    if(!sb)return message("authMessage","Сначала настройте Supabase в index.html.");
    const username=$("regUsername").value.trim(),email=$("regEmail").value.trim(),password=$("regPassword").value;
    if(!/^[a-zA-Z0-9_]{3,24}$/.test(username))return message("authMessage","Имя: 3–24 символа, латиница, цифры и _.");
    if(password.length<8)return message("authMessage","Пароль должен быть не короче 8 символов.");
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});
    if(error)return message("authMessage",error.message);
    message("authMessage",data.session?"Аккаунт создан.":"Проверьте почту для подтверждения регистрации.","success");
    if(data.session) await enter(data.session);
  };
  $("logoutBtn").onclick=async()=>{await sb.auth.signOut();currentUser=null;profile=null;showAuth();};
  $("refreshBtn").onclick=loadProducts; $("search").oninput=renderProducts;
  $("uploadBtn").onclick=async()=>{
    const file=$("modelFile").files[0],title=$("productTitle").value.trim(),description=$("productDescription").value.trim(),price=Number($("productPrice").value);
    if(!file||!title)return message("uploadMessage","Укажи название и выбери файл.");
    if(!file.name.toLowerCase().endsWith(".glb"))return message("uploadMessage","Поддерживается только .glb.");
    if(file.size>50*1024*1024)return message("uploadMessage","Максимальный размер файла 50 МБ.");
    if(!Number.isFinite(price)||price<0)return message("uploadMessage","Проверь цену.");
    $("uploadBtn").disabled=true;message("uploadMessage","Загрузка файла...");
    const path=`${currentUser.id}/${crypto.randomUUID()}.glb`;
    try{
      const up=await sb.storage.from(BUCKET).upload(path,file,{contentType:"model/gltf-binary",upsert:false});
      if(up.error)throw up.error;
      const ins=await sb.from("products").insert({title,description,price,file_path:path,owner_id:currentUser.id});
      if(ins.error){await sb.storage.from(BUCKET).remove([path]);throw ins.error;}
      $("productTitle").value="";$("productDescription").value="";$("modelFile").value="";
      message("uploadMessage","Товар опубликован.","success");await loadProducts();
    }catch(e){message("uploadMessage","Ошибка: "+e.message);}
    finally{$("uploadBtn").disabled=false;}
  };
  async function init(){
    if(!configured){message("authMessage","Настройка не завершена: открой index.html и вставь URL и anon key из Supabase.");return;}
    const {data:{session}}=await sb.auth.getSession();
    if(session)await enter(session);
    sb.auth.onAuthStateChange((_event,session)=>{if(!session){currentUser=null;profile=null;showAuth();}});
  }
  init();
})();
</script>
</body>
</html>
