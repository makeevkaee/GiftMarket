
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDZX MARKET</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0b0b10;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    background: #12121a;
    border-bottom: 1px solid #262633;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: #a879ff;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 8px;
    padding: 11px 17px;
    font-weight: bold;
    color: white;
    background: #824cff;
}

button:hover {
    background: #986dff;
}

.secondary {
    background: #252532;
}

main {
    max-width: 1200px;
    margin: 35px auto;
    padding: 0 20px;
}

.hero {
    background: linear-gradient(120deg, #211638, #11111b);
    border: 1px solid #35264e;
    padding: 35px;
    border-radius: 15px;
    margin-bottom: 30px;
}

.hero h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.hero p {
    color: #aaa;
}

h2 {
    margin: 25px 0 18px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 18px;
}

.product {
    background: #15151f;
    border: 1px solid #292938;
    border-radius: 12px;
    padding: 17px;
}

.product-preview {
    height: 140px;
    background: #222230;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 45px;
    margin-bottom: 15px;
}

.product h3 {
    margin-bottom: 8px;
}

.product p {
    color: #aaa;
    font-size: 13px;
    margin-bottom: 12px;
}

.price {
    color: #b38aff;
    font-weight: bold;
    margin-bottom: 12px;
}

.modal {
    position: fixed;
    inset: 0;
    background: #000c;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-box {
    background: #171722;
    border: 1px solid #38384a;
    border-radius: 14px;
    padding: 25px;
    width: 100%;
    max-width: 390px;
}

.modal-box h2 {
    margin: 0 0 20px;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 12px;
    background: #0d0d14;
    border: 1px solid #363646;
    border-radius: 8px;
    color: white;
    outline: none;
}

input:focus {
    border-color: #824cff;
}

.modal-box button {
    width: 100%;
    margin-top: 8px;
}

.close {
    float: right;
    cursor: pointer;
    color: #aaa;
    font-size: 22px;
}

#userPanel {
    display: none;
    background: #15151f;
    border: 1px solid #292938;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
}

.muted {
    color: #999;
    font-size: 13px;
    margin-top: 7px;
}

#status {
    margin-top: 12px;
    color: #b38aff;
    font-size: 13px;
}

footer {
    text-align: center;
    color: #666;
    padding: 40px 15px;
}

@media(max-width:600px) {
    header {
        padding: 0 15px;
    }

    .hero h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">IDZX MARKET</div>

    <div id="authButtons">
        <button class="secondary" onclick="openAuth('login')">Войти</button>
        <button onclick="openAuth('register')">Регистрация</button>
    </div>

    <div id="loggedButtons" style="display:none">
        <button class="secondary" onclick="logout()">Выйти</button>
    </div>
</header>

<main>

    <section class="hero">
        <h1>Добро пожаловать в IDZX MARKET</h1>
        <p>Покупай, продавай и коллекционируй 3D-модели.</p>
    </section>

    <section id="userPanel">
        <h2>Мой профиль</h2>
        <h3 id="username">Пользователь</h3>
        <p class="muted" id="userEmail"></p>
        <p class="muted" id="userBalance"></p>
    </section>

    <h2>Магазин</h2>

    <div class="products" id="products">
        <p class="muted">Загрузка товаров...</p>
    </div>

    <p id="status"></p>

</main>

<footer>
    IDZX MARKET © 2026
</footer>

<!-- ОКНО АВТОРИЗАЦИИ -->

<div class="modal" id="authModal">
    <div class="modal-box">

        <span class="close" onclick="closeAuth()">×</span>

        <h2 id="modalTitle">Вход</h2>

        <div id="registerFields" style="display:none">
            <input id="regUsername" placeholder="Имя пользователя">
        </div>

        <input id="email" type="email" placeholder="Электронная почта">
        <input id="password" type="password" placeholder="Пароль">

        <button onclick="submitAuth()">Продолжить</button>

        <p class="muted" id="authMessage"></p>

    </div>
</div>

<script>
// ======================================
// SUPABASE CONFIGURATION
// ======================================

const SUPABASE_URL = "https://alcncjuftdwxoujboiwq.supabase.co";

// ВСТАВЬ СЮДА СВОЙ PUBLISHABLE KEY
const SUPABASE_KEY = "ВСТАВЬ_СВОЙ_PUBLISHABLE_KEY";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// ======================================
// AUTHENTICATION
// ======================================

let authMode = "login";

function openAuth(mode) {
    authMode = mode;

    document.getElementById("authModal").style.display = "flex";

    document.getElementById("modalTitle").textContent =
        mode === "login" ? "Вход в аккаунт" : "Создание аккаунта";

    document.getElementById("registerFields").style.display =
        mode === "register" ? "block" : "none";

    document.getElementById("authMessage").textContent = "";
}

function closeAuth() {
    document.getElementById("authModal").style.display = "none";
}

async function submitAuth() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("authMessage");

    message.textContent = "Подождите...";

    if (!email || !password) {
        message.textContent = "Заполните все поля.";
        return;
    }

    let result;

    if (authMode === "register") {

        const username =
            document.getElementById("regUsername").value.trim();

        if (!username) {
            message.textContent = "Введите имя пользователя.";
            return;
        }

        result = await db.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    username: username
                }
            }
        });

    } else {

        result = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

    }

    if (result.error) {
        message.textContent = result.error.message;
        return;
    }

    if (authMode === "register" && !result.data.session) {
        message.textContent =
            "Регистрация прошла. Проверьте почту для подтверждения.";
        return;
    }

    closeAuth();
    await loadUser();

}

// ======================================
// USER PROFILE
// ======================================

async function loadUser() {

    const { data: authData } = await db.auth.getUser();

    const user = authData.user;

    if (!user) {
        showLoggedOut();
        return;
    }

    const { data: profile, error } = await db
        .from("profiles")
        .select("username, first_name, last_name, balance, is_admin")
        .eq("id", user.id)
        .maybeSingle();

    if (error) {
        console.error(error);
        document.getElementById("status").textContent =
            "Не удалось загрузить профиль.";
        return;
    }

    if (!profile) {
        document.getElementById("status").textContent =
            "Аккаунт создан. Профиль ещё не создан в базе данных.";
    }

    document.getElementById("authButtons").style.display = "none";
    document.getElementById("loggedButtons").style.display = "block";
    document.getElementById("userPanel").style.display = "block";

    document.getElementById("username").textContent =
        profile?.username || user.email;

    document.getElementById("userEmail").textContent =
        user.email;

    document.getElementById("userBalance").textContent =
        profile
            ? "Баланс: " + profile.balance
            : "Баланс: не загружен";

}

function showLoggedOut() {
    document.getElementById("authButtons").style.display = "block";
    document.getElementById("loggedButtons").style.display = "none";
    document.getElementById("userPanel").style.display = "none";
}

async function logout() {
    const { error } = await db.auth.signOut();

    if (error) {
        alert(error.message);
        return;
    }

    showLoggedOut();
}

// ======================================
// MARKET
// ======================================

async function loadProducts() {

    const container = document.getElementById("products");

    const { data, error } = await db
        .from("models")
        .select("id, name, price, stock, rarity")
        .order("created_at", { ascending: false });

    if (error) {
        container.innerHTML =
            "<p class='muted'>Не удалось загрузить товары. Проверьте SQL и RLS в Supabase.</p>";
        console.error(error);
        return;
    }

    if (!data || data.length === 0) {
        container.innerHTML =
            "<p class='muted'>Пока товаров нет.</p>";
        return;
    }

    container.innerHTML = "";

    data.forEach(item => {

        const card = document.createElement("div");
        card.className = "product";

        const preview = document.createElement("div");
        preview.className = "product-preview";
        preview.textContent = "◆";

        const name = document.createElement("h3");
        name.textContent = item.name;

        const rarity = document.createElement("p");
        rarity.textContent = "Редкость: " + (item.rarity || "Обычная");

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = "Цена: " + item.price;

        const stock = document.createElement("p");
        stock.textContent = "В наличии: " + item.stock;

        card.append(preview, name, rarity, price, stock);
        container.appendChild(card);

    });

}

// ======================================
// START
// ======================================

async function startApp() {

    await loadUser();
    await loadProducts();

}

db.auth.onAuthStateChange(() => {
    setTimeout(loadUser, 0);
});

startApp();

</script>

</body>
</html>
