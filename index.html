
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Market</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#0b1020;--panel:#151d31;--line:#2b3852;--txt:#f4f6fc;--muted:#9ba9bf;--accent:#8b7cff;--green:#39d9a3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px Arial,sans-serif}
button,input,select,textarea{font:inherit}button{border:0;border-radius:10px;padding:11px 15px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#0d1527;color:var(--txt)}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}
.hidden{display:none!important}.muted{color:var(--muted);font-size:13px}.error{color:#ff8585;min-height:20px}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.authbox{width:min(440px,100%);background:var(--panel);padding:25px;border:1px solid var(--line);border-radius:18px}
.logo{text-align:center;font-size:28px;font-weight:900;margin:0 0 20px}.logo span{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}.tabs{display:flex;gap:8px}.tabs button{flex:1}.secondary{background:#293650}.danger{background:#b93652}
.app{max-width:1100px;margin:auto;padding:14px 14px 90px}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px}
.header .logo{margin:0;font-size:22px}.balance{color:var(--green);font-weight:bold}.topsearch{margin:12px 0}
.nav{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px max(12px,calc((100vw - 700px)/2));background:#10182aee;border-top:1px solid var(--line);z-index:3}
.nav button{background:#26334c}.nav button.active{background:var(--accent)}
.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.preview{height:170px;background:#080d18;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
model-viewer{width:100%;height:100%}.actions{display:flex;gap:7px;margin-top:10px}.actions button{flex:1}.mini{padding:7px 10px;font-size:13px}
.profileline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.userrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;place-items:center;padding:14px}.modal.open{display:grid}
.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.close{float:right}.small{font-size:12px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.rarity{font-weight:bold}.r0{color:#eee}.r1{color:#ffd84d}.r2{color:#42d66b}.r3{color:#55aaff}.r4{color:#ff5555}.r5{color:#bd72ff}
@media(max-width:560px){.app{padding:9px 9px 85px}.header{align-items:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:9px}.preview{height:130px}.actions{flex-direction:column}}
</style>
</head>
<body>
<section id="auth" class="auth">
 <div class="authbox">
  <h1 class="logo">3D <span>Market</span></h1>
  <div class="tabs"><button id="showLogin">Войти</button><button id="showRegister" class="secondary">Регистрация</button></div>
  <div id="loginForm">
   <label>Username</label><input id="loginUsername" autocomplete="username">
   <label>Пароль</label><div class="row"><input id="loginPassword" type="password" autocomplete="current-password"><button class="secondary mini" onclick="togglePass('loginPassword',this)">Показать</button></div>
   <button style="width:100%;margin-top:15px" onclick="login()">Войти</button>
  </div>
  <div id="registerForm" class="hidden">
   <label>Имя</label><input id="regFirst" maxlength="40">
   <label>Фамилия</label><input id="regLast" maxlength="40">
   <label>Username (только английские буквы, цифры и _)</label><input id="regUsername" maxlength="24">
   <label>Пароль</label><div class="row"><input id="regPassword" type="password"><button class="secondary mini" onclick="togglePass('regPassword',this)">Показать</button></div>
   <button style="width:100%;margin-top:15px" onclick="register()">Зарегистрироваться</button>
  </div>
  <p id="authError" class="error"></p>
 </div>
</section>

<main id="app" class="app hidden">
 <header class="header">
  <h1 class="logo">3D <span>Market</span></h1>
  <div class="row" style="flex:0 1 auto"><span id="headerUser"></span><b id="headerBalance" class="balance"></b><button class="secondary mini" onclick="logout()">Выйти</button></div>
 </header>
 <div class="topsearch"><input id="friendSearch" placeholder="Найти пользователя по username..." oninput="searchUsers()"></div>
 <section id="home">
  <div class="panel">
   <div class="profileline"><div><b id="profileName"></b><div class="muted" id="profileHandle"></div><div id="profileDescription" class="muted"></div></div><button class="secondary mini" onclick="openSettings()">Настройки</button></div>
   <div class="row" style="margin-top:14px">
    <button class="secondary" onclick="showPeople('following')">Подписки <span id="followingCount">0</span></button>
    <button class="secondary" onclick="showPeople('followers')">Подписчики <span id="followersCount">0</span></button>
   </div>
  </div>
  <div class="panel"><h3>Уведомления</h3><div id="notifications">Нет уведомлений</div></div>
  <div class="panel hidden" id="searchResults"><h3>Пользователи</h3><div id="userResults"></div></div>
  <div class="panel hidden" id="peoplePanel"><button class="secondary mini" onclick="$('peoplePanel').classList.add('hidden')">Закрыть</button><h3 id="peopleTitle"></h3><div id="peopleList"></div></div>
 </section>
 <section id="pageContent"></section>
</main>

<nav id="bottomNav" class="nav hidden">
 <button data-page="inventory" onclick="goPage('inventory')">Инвентарь</button>
 <button data-page="shop" class="active" onclick="goPage('shop')">Магазин</button>
 <button data-page="market" onclick="goPage('market')">Маркет</button>
</nav>

<div id="modal" class="modal"><div class="modalbox"><button class="secondary mini close" onclick="closeModal()">Закрыть</button><div id="modalBody"></div></div></div>

<script>
/* ВСТАВЬ СЮДА ДАННЫЕ СВОЕГО ПРОЕКТА SUPABASE */
const SUPABASE_URL = "https://alcncjuftdwxoujboiwq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_KqQH_PSPD51cJrHe9HiDqQ_8c2LUqZe";
const API_URL = SUPABASE_URL + "https://alcncjuftdwxoujboiwq.supabase.co/functions/v1/api";
/* КОНЕЦ НАСТРОЕК */

const $=id=>document.getElementById(id);
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let token=localStorage.getItem("3dm_token")||"",me=null,currentPage="shop",rate={EUR:1,USD:1,RUB:1},models=[],inventory=[],listings=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function togglePass(id,b){let x=$(id);x.type=x.type==="password"?"text":"password";b.textContent=x.type==="password"?"Показать":"Скрыть"}
async function api(action,data={}){let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":token?"Bearer "+token:""},body:JSON.stringify({action,...data})});let j=await r.json().catch(()=>({error:"Ошибка ответа сервера"}));if(!r.ok||j.error)throw Error(j.error||"Ошибка");return j}
function authError(e){$("authError").textContent=e.message||String(e)}
$("showLogin").onclick=()=>{$("loginForm").classList.remove("hidden");$("registerForm").classList.add("hidden");$("authError").textContent=""};
$("showRegister").onclick=()=>{$("registerForm").classList.remove("hidden");$("loginForm").classList.add("hidden");$("authError").textContent=""};
async function login(){try{let r=await api("login",{username:$("loginUsername").value.trim(),password:$("loginPassword").value});token=r.access_token;localStorage.setItem("3dm_token",token);await start()}catch(e){authError(e)}}
async function register(){try{let r=await api("register",{first_name:$("regFirst").value.trim(),last_name:$("regLast").value.trim(),username:$("regUsername").value.trim(),password:$("regPassword").value});token=r.access_token;localStorage.setItem("3dm_token",token);await start()}catch(e){authError(e)}}
async function start(){try{let r=await api("me");me=r.profile;await loadAll();$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("bottomNav").classList.remove("hidden");renderHeader();goPage("shop");loadRates();loadNotifications();}catch(e){token="";localStorage.removeItem("3dm_token");$("auth").classList.remove("hidden");$("app").classList.add("hidden");authError(e)}}
async function logout(){token="";localStorage.removeItem("3dm_token");me=null;$("app").classList.add("hidden");$("bottomNav").classList.add("hidden");$("auth").classList.remove("hidden")}
function renderHeader(){$("headerUser").textContent="@"+me.username;$("headerBalance").textContent=fmt(me.balance);$("profileName").textContent=(me.flag||"")+" "+me.first_name+" "+me.last_name;$("profileHandle").textContent="@"+me.username;$("profileDescription").textContent=me.description||""}
function fmt(eur){return (Number(eur||0)*(rate[me?.currency||"EUR"]||1)).toLocaleString("ru-RU",{maximumFractionDigits:2})+" "+(me?.currency||"EUR")}
async function loadRates(){try{let r=await fetch("https://open.er-api.com/v6/latest/EUR");let j=await r.json();if(j.result==="success"){rate={EUR:1,USD:j.rates.USD||1,RUB:j.rates.RUB||1};$("headerBalance").textContent=fmt(me.balance);renderPage()}}catch(e){console.warn("Курс валют недоступен, показан расчёт по базовой валюте")}}
async function loadAll(){let [m,i,l]=await Promise.all([api("models"),api("inventory"),api("listings")]);models=m.models||[];inventory=i.inventory||[];listings=l.listings||[]}
function goPage(p){currentPage=p;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===p));$("home").classList.toggle("hidden",p!=="shop");renderPage()}
function renderPage(){let list=currentPage==="shop"?models:currentPage==="inventory"?inventory:listings;let html=list.length?'<div class="grid">'+list.map(x=>modelCard(x)).join("")+'</div>':'<div class="panel">Пока здесь пусто.</div>';$("pageContent").innerHTML=html}
function modelCard(x){let m=x.model||x;let price=x.price??m.price;let rare=m.rarity||"Обычная";let colors={"Обычная":"r0","Необычная":"r1","Редкая":"r2","Очень редкая":"r3","Эпическая":"r4","Легендарная":"r5"};let isInv=currentPage==="inventory";let isMarket=currentPage==="market";return `<article class="card"><div class="preview">${m.preview_url?`<model-viewer src="${esc(m.preview_url)}" camera-controls auto-rotate></model-viewer>`:"3D"}</div><h3>${esc(m.name)}</h3><div class="muted">${esc(m.owner_username||"")}</div><p class="rarity ${colors[rare]||"r0"}">${esc(rare)}</p><b>${fmt(price)}</b><div class="actions">${isInv?`<button onclick="sellItem('${x.id}')">Продать</button>`:`<button onclick="${isMarket?`buyListing('${x.id}')`:`buyModel('${m.id}')`}">Купить</button>`}<button class="secondary" onclick="previewModel('${m.id}')">Просмотр</button></div></article>`}
async function buyModel(id){try{await api("buy_model",{model_id:id});await refresh();alert("Покупка прошла успешно")}catch(e){alert(e.message)}}
async function buyListing(id){try{await api("buy_listing",{listing_id:id});await refresh();alert("Покупка прошла успешно")}catch(e){alert(e.message)}}
async function sellItem(id){let p=prompt("Цена продажи в вашей валюте ("+me.currency+")");if(p===null)return;let eur=Number(p)/(rate[me.currency]||1);if(!Number.isFinite(eur)||eur<=0)return alert("Укажите корректную цену");try{await api("create_listing",{inventory_id:id,price:eur});await refresh();goPage("market")}catch(e){alert(e.message)}}
async function refresh(){await loadAll();let r=await api("me");me=r.profile;renderHeader();renderPage()}
async function previewModel(id){try{let r=await api("model_url",{model_id:id});openModal(`<h2>${esc(r.model.name)}</h2><div class="preview" style="height:400px"><model-viewer src="${esc(r.signed_url)}" camera-controls auto-rotate></model-viewer></div>`)}catch(e){alert(e.message)}}
function openModal(html){$("modalBody").innerHTML=html;$("modal").classList.add("open")}function closeModal(){$("modal").classList.remove("open")}
async function openSettings(){openModal(`<h2>Настройки профиля</h2>
<label>Имя</label><input id="setFirst" value="${esc(me.first_name)}">
<label>Фамилия</label><input id="setLast" value="${esc(me.last_name)}">
<label>Username</label><input id="setUsername" value="${esc(me.username)}" ${me.is_admin?"":"disabled"}>
<label>Описание</label><textarea id="setDesc">${esc(me.description||"")}</textarea>
<label>Флаг страны (например 🇸🇮)</label><input id="setFlag" value="${esc(me.flag||"")}">
<div class="row"><div><label>Язык</label><select id="setLang"><option value="ru" ${me.language==="ru"?"selected":""}>Русский</option><option value="en" ${me.language==="en"?"selected":""}>English</option></select></div>
<div><label>Валюта</label><select id="setCurrency"><option ${me.currency==="EUR"?"selected":""}>EUR</option><option ${me.currency==="USD"?"selected":""}>USD</option><option ${me.currency==="RUB"?"selected":""}>RUB</option></select></div></div>
<button onclick="saveProfile()">Сохранить</button><hr><h3>Изменить пароль</h3><label>Старый пароль</label><input id="oldPassword" type="password"><label>Новый пароль</label><input id="newPassword" type="password"><button onclick="changePassword()">Изменить пароль</button>
${me.is_admin?`<hr><button onclick="showUsers()">Все пользователи</button> <button onclick="showUpload()">Загрузить 3D модель</button>`:""}<p id="settingsError" class="error"></p>`)}
async function saveProfile(){try{let r=await api("save_profile",{first_name:$("setFirst").value,last_name:$("setLast").value,username:$("setUsername").value,description:$("setDesc").value,flag:$("setFlag").value,language:$("setLang").value,currency:$("setCurrency").value});me=r.profile;renderHeader();closeModal()}catch(e){$("settingsError").textContent=e.message}}
async function changePassword(){try{await api("change_password",{old_password:$("oldPassword").value,new_password:$("newPassword").value});$("settingsError").textContent="Пароль изменён"}catch(e){$("settingsError").textContent=e.message}}
async function searchUsers(){let q=$("friendSearch").value.trim();if(!q){$("searchResults").classList.add("hidden");return}try{let r=await api("search_users",{query:q});$("searchResults").classList.remove("hidden");$("userResults").innerHTML=(r.users||[]).map(userLine).join("")||"Никого не найдено"}catch(e){}}
function userLine(u){return `<div class="userrow"><span>${esc(u.flag||"")} @${esc(u.username)}</span><button class="mini" onclick="toggleFollow('${u.id}')">${u.following?"Отписаться":"Подписаться"}</button></div>`}
async function toggleFollow(id){try{await api("toggle_follow",{user_id:id});searchUsers();loadPeopleCounts()}catch(e){alert(e.message)}}
async function showPeople(kind){try{let r=await api(kind);let users=r.users||[];$("peoplePanel").classList.remove("hidden");$("peopleTitle").textContent=kind==="following"?"Подписки":"Подписчики";$("peopleList").innerHTML=users.map(userLine).join("")||"Пока никого нет"}catch(e){alert(e.message)}}
async function loadPeopleCounts(){try{let a=await api("following"),b=await api("followers");$("followingCount").textContent=(a.users||[]).length;$("followersCount").textContent=(b.users||[]).length}catch(e){}}
async function loadNotifications(){try{let r=await api("notifications");$("notifications").innerHTML=(r.notifications||[]).map(n=>`<div class="userrow">${esc(n.message)} <span class="small">${new Date(n.created_at).toLocaleString()}</span></div>`).join("")||"Нет уведомлений"}catch(e){}}
async function showUsers(){try{let r=await api("all_users");openModal(`<h2>Пользователи</h2><input id="adminUserSearch" placeholder="Поиск по началу username" oninput="filterAdminUsers()"><div id="adminUserList">${r.users.map(u=>`<div class="userrow" data-u="${esc(u.username.toLowerCase())}"><span>${esc(u.flag||"")} @${esc(u.username)}</span><b>${Number(u.balance).toFixed(2)} EUR</b></div>`).join("")}</div>`)}catch(e){alert(e.message)}}
function filterAdminUsers(){let q=$("adminUserSearch").value.toLowerCase();document.querySelectorAll("#adminUserList .userrow").forEach(x=>x.classList.toggle("hidden",!x.dataset.u.startsWith(q)))}
function showUpload(){openModal(`<h2>Загрузка 3D модели</h2><label>Файл 3D модели</label><input id="modelFile" type="file" accept=".glb,.gltf,.obj,.fbx,.stl"><label>Название модели</label><input id="modelName"><label>Цена в валюте профиля (${me.currency})</label><input id="modelPrice" type="number" min="0" step="0.01"><label>Редкость</label><select id="modelRarity"><option value="Обычная">Белая · Обычная</option><option value="Необычная">Жёлтая · Необычная</option><option value="Редкая">Зелёная · Редкая</option><option value="Очень редкая">Синяя · Очень редкая</option><option value="Эпическая">Красная · Эпическая</option><option value="Легендарная">Фиолетовая · Легендарная</option></select><button style="margin-top:15px" onclick="uploadModel()">Продолжить</button><p id="uploadError" class="error"></p>`)}
async function uploadModel(){try{let f=$("modelFile").files[0],name=$("modelName").value.trim(),price=Number($("modelPrice").value);if(!f||!name||!Number.isFinite(price)||price<0)throw Error("Заполните все поля и выберите файл");let eur=price/(rate[me.currency]||1);let init=await api("upload_init",{filename:f.name,content_type:f.type||"application/octet-stream"});let {error}=await sb.storage.from("3d-models").uploadToSignedUrl(init.path,init.token,f);if(error)throw error;await api("upload_finish",{path:init.path,name,price:eur,rarity:$("modelRarity").value});await refresh();closeModal();alert("Модель опубликована в магазине")}catch(e){$("uploadError").textContent=e.message}}
(async()=>{if(token)await start()})();
</script>
</body>
</html>
